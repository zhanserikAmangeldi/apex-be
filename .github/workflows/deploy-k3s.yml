name: Build & Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'api-gateway/**'
      - 'user-service/**'
      - 'editor-service/**'
      - 'ai-service/**'
      - 'content-scraper-service/**'

permissions:
  contents: write

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          SERVICES=()
          for service in api-gateway user-service editor-service ai-service content-scraper-service; do
            if git diff --name-only HEAD~1 HEAD | grep -q "^${service}/"; then
              SERVICES+=("\"${service}\"")
            fi
          done
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            echo "services=[$(IFS=,; echo "${SERVICES[*]}")]" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          docker buildx build --platform linux/amd64 \
            -t $DOCKER_USERNAME/apex-${{ matrix.service }}:$IMAGE_TAG \
            -t $DOCKER_USERNAME/apex-${{ matrix.service }}:latest \
            --push ./${{ matrix.service }}

  update-manifests:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update image tags in kustomization
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          SERVICES='${{ needs.detect-changes.outputs.services }}'

          for service in $(echo $SERVICES | jq -r '.[]'); do
            echo "Updating apex-${service} to tag ${IMAGE_TAG}"
            sed -i "s|newTag: .*# apex-${service}|newTag: \"${IMAGE_TAG}\" # apex-${service}|" \
              k8s/overlays/k3s-prod/kustomization.yaml
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/k3s-prod/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags [skip ci]"
          git push
