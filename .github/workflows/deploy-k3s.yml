name: Deploy to K3s

on:
  push:
    branches: [master]
    paths:
      - 'api-gateway/**'
      - 'user-service/**'
      - 'editor-service/**'
      - 'ai-service/**'
      - 'content-scraper-service/**'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          SERVICES=()
          for service in api-gateway user-service editor-service ai-service content-scraper-service; do
            if git diff --name-only HEAD~1 HEAD | grep -q "^${service}/"; then
              SERVICES+=("\"${service}\"")
            fi
          done
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            echo "services=[$(IFS=,; echo "${SERVICES[*]}")]" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t $DOCKER_USERNAME/apex-${{ matrix.service }}:$IMAGE_TAG ./${{ matrix.service }}
          docker tag $DOCKER_USERNAME/apex-${{ matrix.service }}:$IMAGE_TAG \
                     $DOCKER_USERNAME/apex-${{ matrix.service }}:latest
          docker push $DOCKER_USERNAME/apex-${{ matrix.service }}:$IMAGE_TAG
          docker push $DOCKER_USERNAME/apex-${{ matrix.service }}:latest

      - name: Trigger ArgoCD sync
        run: |
          echo "Image $DOCKER_USERNAME/apex-${{ matrix.service }}:$IMAGE_TAG pushed"
          echo "ArgoCD will sync automatically"
