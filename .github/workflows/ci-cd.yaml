name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/apex

jobs:
  # ============================================
  # Detect which services changed
  # ============================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      user-service: ${{ steps.filter.outputs.user-service }}
      editor-service: ${{ steps.filter.outputs.editor-service }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            user-service:
              - 'user-service/**'
            editor-service:
              - 'editor-service/**'
            ai-service:
              - 'ai-service/**'

  # ============================================
  # Build & Push Docker images
  # ============================================
  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api-gateway
            context: ./api-gateway
            changed: ${{ needs.changes.outputs.api-gateway }}
          - service: user-service
            context: ./user-service
            changed: ${{ needs.changes.outputs.user-service }}
          - service: editor-service
            context: ./editor-service
            changed: ${{ needs.changes.outputs.editor-service }}
          - service: ai-service
            context: ./ai-service
            changed: ${{ needs.changes.outputs.ai-service }}
    if: ${{ matrix.changed == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Update manifests + Deploy secrets
  # ============================================
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in manifests
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for service in api-gateway user-service editor-service ai-service; do
            FILE="k8s/base/services/${service}.yaml"
            if [ -f "$FILE" ]; then
              sed -i "s|image: .*${service}:.*|image: ${{ env.IMAGE_PREFIX }}/${service}:${SHORT_SHA}|" "$FILE"
              echo "Updated ${service} to ${SHORT_SHA}"
            fi
          done

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --staged --quiet || {
            git commit -m "ci: update image tags to ${{ github.sha }}"
            git push
          }

  # ============================================
  # Sync secrets to cluster
  # Runs on push to main/develop
  # Requires KUBE_CONFIG secret in GitHub
  # ============================================
  sync-secrets:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Set namespace
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "NAMESPACE=apex-prod" >> $GITHUB_ENV
          else
            echo "NAMESPACE=apex-dev" >> $GITHUB_ENV
          fi

      - name: Create/update secrets
        run: |
          NS=${{ env.NAMESPACE }}
          kubectl create namespace $NS --dry-run=client -o yaml | kubectl apply -f -

          # PostgreSQL secrets
          kubectl create secret generic user-postgres-secret \
            --from-literal=POSTGRES_DB="${{ secrets.USER_DB_NAME }}" \
            --from-literal=POSTGRES_USER="${{ secrets.USER_DB_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.USER_DB_PASSWORD }}" \
            --namespace=$NS --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic editor-postgres-secret \
            --from-literal=POSTGRES_DB="${{ secrets.EDITOR_DB_NAME }}" \
            --from-literal=POSTGRES_USER="${{ secrets.EDITOR_DB_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.EDITOR_DB_PASSWORD }}" \
            --namespace=$NS --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic ai-postgres-secret \
            --from-literal=POSTGRES_DB="${{ secrets.AI_DB_NAME }}" \
            --from-literal=POSTGRES_USER="${{ secrets.AI_DB_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.AI_DB_PASSWORD }}" \
            --namespace=$NS --dry-run=client -o yaml | kubectl apply -f -

          # MinIO
          kubectl create secret generic minio-secret \
            --from-literal=MINIO_ROOT_USER="${{ secrets.MINIO_USER }}" \
            --from-literal=MINIO_ROOT_PASSWORD="${{ secrets.MINIO_PASSWORD }}" \
            --namespace=$NS --dry-run=client -o yaml | kubectl apply -f -

          # Application secrets
          kubectl create secret generic api-gateway-secret \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --namespace=$NS --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic user-service-secret \
            --from-literal=DB_USER="${{ secrets.USER_DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.USER_DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=SMTP_HOST="${{ secrets.SMTP_HOST }}" \
            --from-literal=SMTP_USER="${{ secrets.SMTP_USER }}" \
            --from-literal=SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
            --from-literal=SMTP_FROM="${{ secrets.SMTP_FROM }}" \
            --from-literal=MINIO_USER="${{ secrets.MINIO_USER }}" \
            --from-literal=MINIO_PASSWORD="${{ secrets.MINIO_PASSWORD }}" \
            --namespace=$NS --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic editor-service-secret \
            --from-literal=DB_USER="${{ secrets.EDITOR_DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.EDITOR_DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=MINIO_ACCESS_KEY="${{ secrets.MINIO_USER }}" \
            --from-literal=MINIO_SECRET_KEY="${{ secrets.MINIO_PASSWORD }}" \
            --namespace=$NS --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic ai-service-secret \
            --from-literal=DB_USER="${{ secrets.AI_DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.AI_DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --namespace=$NS --dry-run=client -o yaml | kubectl apply -f -

          echo "All secrets synced to $NS"
