apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: editor-postgres-pvc
  namespace: apex
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: editor-postgres
  namespace: apex
  labels:
    app: editor-postgres
spec:
  serviceName: editor-postgres
  replicas: 1
  selector:
    matchLabels:
      app: editor-postgres
  template:
    metadata:
      labels:
        app: editor-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: editor-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: editor-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: editor-postgres
  namespace: apex
spec:
  selector:
    app: editor-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: v1
kind: Secret
metadata:
  name: editor-postgres-secret
  namespace: apex
type: Opaque
stringData:
  POSTGRES_DB: editor_service
  POSTGRES_USER: editor-service
  POSTGRES_PASSWORD: change-me-in-production
