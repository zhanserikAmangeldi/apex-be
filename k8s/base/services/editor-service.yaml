apiVersion: apps/v1
kind: Deployment
metadata:
  name: editor-service
  namespace: apex
  labels:
    app: editor-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: editor-service
  template:
    metadata:
      labels:
        app: editor-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z editor-postgres 5432 && nc -z minio 9000 && nc -z user-service 8080; do echo waiting for dependencies; sleep 2; done']
      containers:
        - name: editor-service
          image: apex/editor-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 1234
              name: websocket
          envFrom:
            - configMapRef:
                name: editor-service-config
            - secretRef:
                name: editor-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: editor-service
  namespace: apex
spec:
  selector:
    app: editor-service
  ports:
    - port: 3000
      targetPort: 3000
      name: http
    - port: 1234
      targetPort: 1234
      name: websocket
---
apiVersion: v1
kind: Secret
metadata:
  name: editor-service-secret
  namespace: apex
type: Opaque
stringData:
  DB_USER: editor-service
  DB_PASSWORD: change-me-in-production
  JWT_SECRET: your-super-secret-jwt-key-change-in-production-min-32-chars
  MINIO_ACCESS_KEY: admin
  MINIO_SECRET_KEY: change-me-in-production-min-8-chars
