apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-scraper-service
  namespace: apex
  labels:
    app: content-scraper-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-scraper-service
  template:
    metadata:
      labels:
        app: content-scraper-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z scraper-postgres 5432 && nc -z redis 6379; do echo waiting for dependencies; sleep 2; done']
      containers:
        - name: content-scraper-service
          image: apex/content-scraper-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: content-scraper-config
            - secretRef:
                name: content-scraper-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: content-scraper-service
  namespace: apex
spec:
  selector:
    app: content-scraper-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Secret
metadata:
  name: content-scraper-secret
  namespace: apex
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://scraper:change-me-in-production@scraper-postgres:5432/scraper_db"
  ENCRYPTION_KEY: change-me-in-production-encryption-key
  JWT_SECRET: your-super-secret-jwt-key-change-in-production-min-32-chars
---
# Celery Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: apex
  labels:
    app: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z scraper-postgres 5432 && nc -z redis 6379; do echo waiting for dependencies; sleep 2; done']
      containers:
        - name: celery-worker
          image: apex/content-scraper-service:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: content-scraper-config
            - secretRef:
                name: content-scraper-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# Celery Beat
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: apex
  labels:
    app: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']
      containers:
        - name: celery-beat
          image: apex/content-scraper-service:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "app.tasks", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: content-scraper-config
            - secretRef:
                name: content-scraper-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
