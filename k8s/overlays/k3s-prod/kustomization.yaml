apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apex-prod

resources:
  - ../../base

# Используйте Docker Hub образы
images:
  - name: apex/api-gateway
    newName: zhanserik05/apex-api-gateway
    newTag: latest
  - name: apex/user-service
    newName: zhanserik05/apex-user-service
    newTag: latest
  - name: apex/editor-service
    newName: zhanserik05/apex-editor-service
    newTag: latest
  - name: apex/ai-service
    newName: zhanserik05/apex-ai-service
    newTag: latest
  - name: apex/content-scraper-service
    newName: zhanserik05/apex-content-scraper-service
    newTag: latest

patches:
  # imagePullPolicy на Always для всех Deployments
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # imagePullSecrets для всех Deployments
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: dockerhub-secret

  # Replicas
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind: Deployment
      name: editor-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind: Deployment
      name: ai-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: content-scraper-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: celery-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: celery-beat
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # PVC sizes
  - target:
      kind: PersistentVolumeClaim
      name: user-postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi

  - target:
      kind: PersistentVolumeClaim
      name: editor-postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi

  - target:
      kind: PersistentVolumeClaim
      name: ai-postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi

  - target:
      kind: PersistentVolumeClaim
      name: scraper-postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi

  - target:
      kind: PersistentVolumeClaim
      name: minio-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi

  # Ingress override для k3s-prod
  - target:
      kind: Ingress
      name: apex-ingress
    path: ingress-patch.yaml