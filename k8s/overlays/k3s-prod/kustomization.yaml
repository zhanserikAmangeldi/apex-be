apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apex-prod

resources:
  - ../../base

# Docker Hub образы
images:
  - name: apex/api-gateway
    newName: zhanserik05/apex-api-gateway
    newTag: latest # apex-api-gateway
  - name: apex/user-service
    newName: zhanserik05/apex-user-service
    newTag: latest # apex-user-service
  - name: apex/editor-service
    newName: zhanserik05/apex-editor-service
    newTag: latest # apex-editor-service
  - name: apex/ai-service
    newName: zhanserik05/apex-ai-service
    newTag: latest # apex-ai-service
  - name: apex/content-scraper-service
    newName: zhanserik05/apex-content-scraper-service
    newTag: latest # apex-content-scraper-service
  - name: apex/frontend
    newName: zhanserik05/apex-frontend
    newTag: 28a0ae5 # apex-frontend

patches:
  # imagePullPolicy на Always для всех Deployments
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # imagePullSecrets для всех Deployments
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: dockerhub-secret

  # ===== ВСЕ replicas = 1 (экономия RAM на маленькой ноде) =====
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: editor-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: ai-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: content-scraper-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1


  # ===== Минимальные resource requests для 2GB ноды =====
  # Postgres instances: 64Mi request each
  - target:
      kind: StatefulSet
      name: user-postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
  - target:
      kind: StatefulSet
      name: editor-postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
  - target:
      kind: StatefulSet
      name: ai-postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
  - target:
      kind: StatefulSet
      name: scraper-postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi

  # Redis & MinIO
  - target:
      kind: Deployment
      name: redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 256Mi
  - target:
      kind: Deployment
      name: minio
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi

  # App services
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  - target:
      kind: Deployment
      name: editor-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
  - target:
      kind: Deployment
      name: ai-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
  - target:
      kind: Deployment
      name: content-scraper-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi


  # PVC sizes
  - target:
      kind: PersistentVolumeClaim
      name: user-postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: PersistentVolumeClaim
      name: editor-postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: PersistentVolumeClaim
      name: ai-postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: PersistentVolumeClaim
      name: scraper-postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: minio-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi

  # Ingress override
  - target:
      kind: Ingress
      name: apex-ingress
    path: ingress-patch.yaml
