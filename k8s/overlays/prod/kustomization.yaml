apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apex-prod

namePrefix: prod-

resources:
  - ../../base
  - hpa.yaml
  - network-policy.yaml

patches:
  # Scale up for prod
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: user-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: editor-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: ai-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  # Increase storage for prod
  - target:
      kind: PersistentVolumeClaim
      name: user-postgres-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
  - target:
      kind: PersistentVolumeClaim
      name: editor-postgres-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
  - target:
      kind: PersistentVolumeClaim
      name: ai-postgres-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
  - target:
      kind: PersistentVolumeClaim
      name: minio-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 50Gi
  # Prod ingress
  - target:
      kind: Ingress
      name: apex-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: apex.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: apex.example.com

configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    literals:
      - GIN_MODE=release
      - ALLOWED_ORIGINS=https://apex.example.com
  - name: user-service-config
    behavior: merge
    literals:
      - ENV=production
      - BASE_URL=https://apex.example.com
  - name: editor-service-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - MINIO_EXTERNAL_ENDPOINT=storage.apex.example.com
      - MINIO_EXTERNAL_PORT=443
  - name: ai-service-config
    behavior: merge
    literals:
      - ENV=production
