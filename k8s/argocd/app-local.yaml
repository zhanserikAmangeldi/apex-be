apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apex-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: apex
    environment: local
spec:
  project: apex
  source:
    repoURL: https://github.com/zhanserikAmangeldi/apex-be.git
    targetRevision: HEAD
    path: k8s/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: apex
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
